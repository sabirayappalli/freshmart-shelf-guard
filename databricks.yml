bundle:
  name: freshmart_stockout

variables:
  catalog:
    default: sabir_freshmart
  warehouse_id:
    default: abacc2038735a065
  llm_endpoint:
    default: databricks-claude-haiku-5-5
  lakebase_sync_alerts_pipeline:
    description: Sync pipeline behind synced table sabir_freshmart_lakebase.serving.stockout_alerts
    default: 91c8c4c1-9527-4559-9538-df2921b2ca06
  lakebase_sync_briefings_pipeline:
    description: Sync pipeline behind synced table sabir_freshmart_lakebase.serving.store_briefings
    default: e114ece8-6a53-420d-a3b4-c02b6beb6906
  app_sp:
    description: App service principal client id (freshmart-shelf-guard)
    default: "5b2c13f0-0134-4430-8465-0317907aff13"

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
